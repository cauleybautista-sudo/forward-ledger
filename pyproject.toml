[project]
name = "forward-ledger"
version = "0.1.0"
description = "Vercel-Powered Forward Ledger: International Soccer Predictive Model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
