name: Calico Football Tracker Automation

on:
  schedule:
    # Runs twice daily at 00:00 and 12:00 UTC (aligned with pre-kickoff and grading cycles)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Ledger Sync & UI Generation
        env:
          PYTHONPATH: .
        run: |
          python src/sync_ledger.py
          python src/build_ui.py

      - name: Commit & Push Ledger Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LEDGER.md public/index.html index.html
          git diff-index --quiet HEAD || (git commit -m "chore: automated ledger sync [skip ci]" && git push) || true
