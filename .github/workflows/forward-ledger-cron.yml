name: Calico Football Tracker Automation

on:
  schedule:
    # Strategic pre-kickoff T-60m lineup revision windows (16:00, 18:45 UTC) & settlement runs (00:30, 11:30, 22:30 UTC)
    - cron: '30 0 * * *'
    - cron: '30 11 * * *'
    - cron: '0 16 * * *'
    - cron: '45 18 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv numpy scikit-learn

      - name: Run Unit Tests, Closing-Window Sync & Auto-Grading
        env:
          PYTHONPATH: .
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_PROVIDER: ${{ secrets.API_FOOTBALL_PROVIDER }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -m unittest discover -s tests -v
          python src/sync_live_odds.py --window-check || true
          python src/sync_ledger.py
          python src/build_ui.py

      - name: Commit & Push Ledger Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LEDGER.md src/data.json src/v2_ledger.json public/index.html index.html
          git diff-index --quiet HEAD || (git commit -m "chore: automated lineup revision & ledger grading [skip ci]" && git push) || true
