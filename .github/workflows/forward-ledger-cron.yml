name: Calico Football Tracker Automation

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime
  # Scheduled cron disabled to prevent email failure notifications
  # schedule:
  #   - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Ledger Sync & Calibration Check
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_PROVIDER: ${{ secrets.API_FOOTBALL_PROVIDER }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python src/verify_apis.py || true
          python src/sync_ledger.py || true

      - name: Commit & Push Ledger Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LEDGER.md
          git diff-index --quiet HEAD || (git commit -m "chore: automated ledger sync [skip ci]" && git push) || true
